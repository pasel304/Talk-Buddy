kind = "mobile"
previewPath = "/"
title = "VideoSaver - تحميل الفيديوهات"
version = "1.0.0"
id = "artifacts/video-saver"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 21407

[services.development]
run = "pnpm --filter @workspace/video-saver run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/video-saver", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/video-saver", "run", "serve" ]

[services.env]
PORT = "21407"
BASE_PATH = "/"
